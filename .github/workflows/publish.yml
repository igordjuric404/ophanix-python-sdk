name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install release tooling
        run: python -m pip install -e '.[dev,release]'

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy src/ophanix_tool_gateway

      - name: Tests
        run: python -m pytest tests -q --tb=short

      - name: Validate release artifacts
        run: python scripts/validate_release.py --out-dir /tmp/ophanix-python-sdk-release-check

      - name: Build publish distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Check publish distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
